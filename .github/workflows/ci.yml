name: CI

on:
  push:
    branches:
      - nightly
      - production
  pull_request:
    branches:
      - nightly
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Modern (Debug)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project DeadassSimpleMusicPlayer.xcodeproj
          -scheme "Modern (Debug)"
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build
